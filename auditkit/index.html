  <!-- GLightbox Overrides -->
  <style id="glightbox-overrides">
    /* Remove background dimming and blur effects */
    .glightbox-container .goverlay,
    .glightbox-container {
      background: transparent !important;
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
    }
    body.glightbox-open, body.glightbox-open > *:not(.glightbox-container) {
      filter: none !important;
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
    }
    
    /* Ensure the lightbox stays on top */
    .glightbox-container {
      z-index: 2147483000 !important;
    }

    /* Prevent all image panning, dragging, zoom, and touch gestures */
    .glightbox-container .gslide-image img,
    .glightbox-container .gslide-media img {
      pointer-events: none !important;
      user-select: none !important;
      -webkit-user-drag: none !important;
      -webkit-touch-callout: none !important;
      touch-action: none !important;
    }

    /* Prevent slide containers from panning/overflow scrolling */
    .glightbox-container .gslide-image,
    .glightbox-container .ginner-container {
      touch-action: none !important;
      overflow: hidden !important;
    }

    /* Ensure terminal header and controls remain fully interactive */
    .glightbox-container .gslide-description.lightbox-terminal-mounted {
      position: relative;
      z-index: 10;
      pointer-events: auto !important;
    }
    .glightbox-container .lightbox-window-controls,
    .glightbox-container .lightbox-window-controls .win-btn,
    .glightbox-container [data-glightbox-close] {
      position: relative;
      z-index: 11;
      pointer-events: auto !important;
      cursor: pointer;
    }

    /* Custom theme scrollbars */
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--sb-thumb, var(--accent-highlight, #178C7A)) color-mix(in srgb, var(--sb-thumb, var(--accent-highlight, #178C7A)) 15%, transparent);
    }
    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    *::-webkit-scrollbar-track {
      background: color-mix(in srgb, var(--sb-thumb, var(--accent-highlight, #178C7A)) 15%, transparent);
    }
    *::-webkit-scrollbar-thumb {
      background: var(--sb-thumb, var(--accent-highlight, #178C7A));
      border-radius: 8px;
    }
    *::-webkit-scrollbar-thumb:hover {
      filter: brightness(1.15);
    }
  </style>
